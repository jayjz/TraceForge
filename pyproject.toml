[project]
name = "traceforge"
version = "0.1.0"
description = "Process-aware evaluation and adaptive rubrics for tool-using LLM agents"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Jay", email = "jay@movingbytes.dev" }]
keywords = ["agents", "evaluation", "rubrics", "trajectory", "llm", "tool-use"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
  "pydantic>=2.0",
  "pyyaml>=6.0",
  "jsonschema>=4.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.4"]
# Only imports used by the synthetic harness, not CipherLoop's live agent stack.
baseline = ["langchain-core==1.6.0", "langgraph==1.2.11", "docker==7.2.0"]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B"]
